<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Máy Quét Năng Lượng Milo - Đặc Vụ Sữa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #0d0f14;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 12px;
      overflow: hidden;
    }
    header {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 77, 109, 0.3);
    }
    .badge {
      display: inline-block;
      background: #ff4d6d;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.04); }
    }
    h1 {
      font-size: 1.15rem;
      color: #ffe66d;
    }

    /* Khung quét Scanner */
    .scanner-box {
      position: relative;
      width: 100%;
      max-width: 340px;
      aspect-ratio: 1 / 1;
      border: 3px dashed #48cae4;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(72, 202, 228, 0.05) 0%, rgba(0,0,0,0.8) 100%);
      overflow: hidden;
      box-shadow: 0 0 30px rgba(72, 202, 228, 0.2);
    }
    .scanner-box.scanning {
      border-color: #ff4d6d;
      box-shadow: 0 0 40px rgba(255, 77, 109, 0.4);
    }
    .laser-line {
      display: none;
      position: absolute;
      width: 100%;
      height: 4px;
      background: #ff4d6d;
      box-shadow: 0 0 16px #ff4d6d, 0 0 30px #ff4d6d;
      top: 0;
      animation: scanLaser 1.5s ease-in-out infinite alternate;
    }
    @keyframes scanLaser {
      0% { top: 5%; }
      100% { top: 92%; }
    }
    .target-circle {
      width: 170px;
      height: 170px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      position: relative;
    }
    .crosshair {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border-top: 2px solid #ffd166;
      border-bottom: 2px solid #ffd166;
      animation: spinCross 4s linear infinite;
    }
    @keyframes spinCross {
      100% { transform: rotate(360deg); }
    }
    .scan-status {
      margin-top: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #a0aec0;
    }

    /* Đồng hồ đo lực hút */
    .gauge-card {
      width: 100%;
      max-width: 360px;
      background: #181d27;
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .gauge-title {
      font-size: 0.85rem;
      color: #cbd5e0;
    }
    .gauge-value {
      font-size: 1.4rem;
      font-weight: 900;
      color: #06d6a0;
    }
    .gauge-value.danger {
      color: #ff4d6d;
      animation: shake 0.2s infinite;
    }
    @keyframes shake {
      0%, 100% { transform: translate(0); }
      25% { transform: translate(-2px, 1px); }
      75% { transform: translate(2px, -1px); }
    }

    /* Modal Kết Quả Chẩn Đoán */
    .result-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .result-modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: #202736;
      border: 2px solid #ffd166;
      border-radius: 20px;
      padding: 24px 18px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(255, 209, 102, 0.3);
    }
    .modal-box h2 {
      font-size: 1.4rem;
      color: #ff4d6d;
      margin-bottom: 12px;
    }
    .alert-card {
      background: #10141d;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 16px;
      text-align: left;
    }
    .penalty-box {
      background: rgba(255, 209, 102, 0.15);
      border: 1px dashed #ffd166;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.88rem;
      color: #ffd166;
      font-weight: bold;
      margin-bottom: 16px;
    }

    /* Nút bấm */
    .btn-action {
      width: 100%;
      max-width: 360px;
      padding: 15px;
      background: linear-gradient(135deg, #ff4d6d, #d90429);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(217, 4, 41, 0.4);
      transition: transform 0.1s;
    }
    .btn-action:active {
      transform: scale(0.96);
    }
    .btn-action.ok {
      background: linear-gradient(135deg, #06d6a0, #059669);
      box-shadow: 0 6px 20px rgba(6, 214, 160, 0.4);
      color: #0b2b26;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">VIỆN KHOA HỌC MILO QUỐC TẾ</div>
    <h1>MÁY QUÉT ÁP SUẤT HÚT SỮA 🧃</h1>
  </header>

  <div class="scanner-box" id="scanBox">
    <div class="laser-line" id="laser"></div>
    <div class="target-circle">
      <div class="crosshair"></div>
      <span id="faceIcon">👧</span>
    </div>
    <div class="scan-status" id="scanStatus">Đưa mặt đối tượng Sữa vào khung quét...</div>
  </div>

  <div class="gauge-card">
    <div class="gauge-title">Nội lực hút sữa đo được:</div>
    <div class="gauge-value" id="gaugeVal">0 PSI</div>
  </div>

  <button class="btn-action" id="btnScan" onclick="startScan()">BẮT ĐẦU QUÉT
